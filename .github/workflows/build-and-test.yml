# Este workflow realiza las siguientes tareas:
# 1. Compila el proyecto Java usando Gradle
# 2. Verifica el formato del codigo estilo Java con Checkstyle
# 3. Ejecuta todos los tests unitarios y de comportamiento con Cucumber
# 4. Archiva los resultados de los tests y los artefactos compilados
# 5. Ejecuta la aplicación principal y captura su salida
# 6. Se ejecuta en cada push a main y en pull requests

name: Build and Test PMTool

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Run Validations (Linting & Formatting)
        run: ./gradlew validate

      - name: Build and Test (Includes JaCoCo Coverage)
        run: ./gradlew build

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/test/html/

      - name: Run Main and capture output
        run: ./gradlew run --quiet | tee main.log

      - name: Upload Main console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-console-log
          path: main.log

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ValentinoCarmonaS/PMTool-110113

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/cucumber/

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/build/libs/
            **/build/distributions/

      - name: Archive Checkstyle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-results
          path: |
            **/build/reports/checkstyle/